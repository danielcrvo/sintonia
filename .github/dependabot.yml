version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
          - "com.google.devtools.ksp*"
      hilt:
        patterns:
          - "com.google.dagger*"
          - "androidx.hilt*"
      androidx:
        patterns:
          - "androidx.*"
      lint-tools:
        patterns:
          - "dev.detekt*"
          - "org.jlleitschuh.gradle.ktlint*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
